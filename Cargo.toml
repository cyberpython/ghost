[package]
name = "ghost"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
flate2 = "1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "derive"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
serde_json = "1"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ghost-api"

[profile.release]
lto = true
